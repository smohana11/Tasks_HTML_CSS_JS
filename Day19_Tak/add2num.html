<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add two number using fn</title>
</head>
<body>
    <h2>Write a function addNumbers(a, b) that accepts two numbers and returns their sum.</h2>

    <script>
        function addNumbers(a,b){
            return a + b;
        }
        let result=addNumbers(5,10);
        console.log("Add : "+" "+result);
        document.write("Add : "+" "+result);
    </script>
</body>
</html>
