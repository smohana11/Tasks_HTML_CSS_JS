<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swapping</title>
</head>
<body>
    <h2>Swapping two number</h2>
    <script>
        let a = 10;
        let b = 20;

        a = a + b;
        b = a - b;
        a = a - b;

        console.log("a =", a);
        document.write("a=",a +'<br>');
        console.log("b =", b);
        document.write("b=",b);
    </script>
</body>
</html>
