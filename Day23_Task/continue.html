<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue</title>
</head>
<body>
    <h2>Iterate a array using for loop --continue</h2>
    <script>
        for (let i = 1; i <= 10; i++) {

            if (i == 5) {
                continue;
            }
            console.log(i);
            document.write(i+'<br>');
        }
    </script>
</body>
</html>
