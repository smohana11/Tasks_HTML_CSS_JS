<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Second and Third Array Positions</title>
</head>
<body>
    <h2>Access Second and Third Array Positions</h2>
    <script>
        let arr = [1, 2, 3, [4, 5, 6], [7, 8, 9]];
        console.log(arr[3]);
        document.write(arr[3]+'<br>');
        console.log(arr[4]);
        document.write(arr[4]);
    </script>
</body>
</html>
