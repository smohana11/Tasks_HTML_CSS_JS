<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse a string</title>
</head>
<body>
    <h2>Reverse a string</h2>
    <script>
        let str = "javascript";
        let reverse = "";
        for (let i = str.length - 1; i >= 0; i--) {
            reverse = reverse + str[i];
        }
        console.log(reverse);
        document.write(reverse);
    </script>
</body>
</html>
