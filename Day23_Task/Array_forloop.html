<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Using for loop</title>
</head>
<body>
    <h2>Iterate a array using for loop</h2>
    <script>
        let arr = [10, 20, 30, 40, 50];
        for (let i = 0; i < arr.length; i++) {
            console.log(arr[i]);
            document.write(arr[i]+'<br>');
        }
    </script>
</body>
</html>
