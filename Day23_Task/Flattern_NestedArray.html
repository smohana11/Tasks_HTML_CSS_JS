<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flattern a nested array</title>
</head>
<body>
    <h2>Flattern a nested array</h2>
    <script>
        let arr = [1, 2, 3, [4, 5, 6], [7, 8, 9]];
        let result = [];
        for (let i = 0; i < arr.length; i++) {
            if (Array.isArray(arr[i])) {

                for (let j = 0; j < arr[i].length; j++) {
                    result.push(arr[i][j]);
                }
            }
            else {
                result.push(arr[i]);
            }
        }
        console.log(result);
    </script>
</body>
</html>
