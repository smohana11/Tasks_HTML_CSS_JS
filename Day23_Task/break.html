<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break</title>
</head>
<body>
    <h2>Iterate a array using for loop --break</h2>
    <script>
        for (let i = 1; i <= 100; i++) {
            console.log(i);
            document.write(i+'<br>');
            if (i == 100) {
                break;
            }
        }
    </script>
    
</body>
</html>
