<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <h2>Write a function factorial(num) that calculates the factorial of a given number.</h2>

    <script>
        function factorial(num){
            let fact=1;
            for(let i=1;i<=num;i++){
                fact=fact*i;
            }
            return fact;
        }
        console.log("Factorial:",factorial(5));
        document.write("Factorial:",factorial(5));
    </script>
</body>
</html>
