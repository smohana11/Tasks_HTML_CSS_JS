<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowels</title>
</head>
<body>
    <h2>Write a function countVowels(str) that counts the number of vowels in a given string.</h2>

    <script>
        function countVowels(str) {
            let count = 0;
            
            for (let i = 0; i < str.length; i++) {
                let ch=str[i];
                if (ch == 'a' || ch == 'e' || ch == 'i' || ch == 'o' || ch == 'u') {
                    count++;
                }
            }
            return count;
        }
        console.log("Vowels:", countVowels("javascript"));
        document.write("Vowels:" +" "+countVowels("javascript"));

    </script>
</body>
</html>
